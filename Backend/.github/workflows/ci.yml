name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: solar_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-asyncio pytest-cov

    - name: Compile and Lint
      run: |
        python -m compileall app/ tests/ alembic/
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pytest Suite
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/solar_app_test
        JWT_SECRET: test_jwt_secret_key_ci_environment_minimum_32_chars
        OTP_HMAC_SECRET: test_otp_secret_key_ci_environment_minimum_32_chars
        STORAGE_BACKEND: local
        ENVIRONMENT: test
      run: |
        pytest tests/ -v --cov=app --cov-report=term-missing
